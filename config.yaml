# =============================================================================
# RPC Dataset - YOLO Product Detection Configuration
# =============================================================================

# --- Dataset Paths (absolute or relative to project root) ---
dataset:
  root: "/home/aoztuner/02-source/retail"
  annotations:
    train: "instances_train2019.json"
    val: "instances_val2019.json"
    test: "instances_test2019.json"
  images:
    train: "train2019"
    val: "val2019"
    test: "test2019"

# --- YOLO Conversion Output (absolute or relative to project root) ---
output:
  root: "yolo_dataset"

# --- Detection Mode ---
# "single_class" : all 200 RPC categories → one "product" class
# "multi_class"  : each of the 200 RPC categories is its own class
mode: "single_class"

# --- Class Definition (used only in single_class mode) ---
classes:
  - "product"

# --- Training Parameters ---
training:
  model: "yolo11l.pt"            # Model: yolov8n/s/m/l/x.pt, yolo11n/s/m/l/x.pt
  epochs: 100
  imgsz: 640
  batch: 16
  device: "0"                     # "0" for GPU, "cpu", "mps" for Apple Silicon
  workers: 8
  optimizer: "AdamW"              # was "auto" — likely picked AdamW anyway, but 0.01 is a SGD-scale LR and blew it up
  lr0: 0.001                       # was 0.01 — that peak LR caused the epoch1(mAP50=0.94)->epoch6(0.75) collapse
  lrf: 0.01                       # Final learning rate factor
  patience: 50                    # Early stopping patience
  project: "runs"
  name: "rpc_singleclass_yolo11l_50k_lr_experiment"
  pretrained: true
  resume: false                   # Resume from last checkpoint
  exist_ok: false                 # Overwrite existing run

# --- Evaluation Parameters ---
evaluation:
  model: "runs/rpc_singleclass_yolo11l/weights/best.pt"
  conf: 0.25
  iou: 0.5
  imgsz: 640
  device: "0"
  split: "test"                   # Which split to evaluate on

# --- Weights & Biases Logging ---
wandb:
  enabled: true                  # Set to true to enable W&B logging
  project: "rpc-product-detection"
  run_name: "rpc_multiclass_yolo"

# --- Metric-Learning Dataset Augmentation ---
# Builds per-class crop folders under metric_augmentation.output_root:
#   metric_dataset/{train,val,test}/<category_name>/*.jpg
# train crops (clean studio images) are multiplied via augmentation to close the
# domain gap with val/test (real, cluttered checkout scenes). val/test crops are
# extracted as-is (no augmentation) since they must reflect real evaluation conditions.
metric_augmentation:
  enabled: true
  output_root: "metric_dataset"
  img_size: 224
  padding_ratio: 0.10             # extra context around each bbox before cropping
  copies_per_train_image: 5       # augmented copies generated per train crop
  keep_original: true             # also keep the un-augmented crop for train
  seed: 42

  # geometric
  horizontal_flip_prob: 0.5
  rotate_limit: 20
  scale_jitter_min: 0.75
  scale_jitter_max: 1.25
  perspective_prob: 0.3

  # photometric (simulate checkout camera conditions)
  color_jitter_prob: 0.8
  brightness_contrast_limit: 0.3
  hue_shift_limit: 15
  sat_shift_limit: 25
  blur_prob: 0.3
  blur_limit: 5
  noise_prob: 0.3

  # occlusion (hand / other products blocking the view at checkout)
  cutout_prob: 0.35
  cutout_max_holes: 3
  cutout_max_size_ratio: 0.2

  # copy-paste onto real checkout backgrounds — bridges the studio/checkout domain gap
  copy_paste_prob: 0.5
  copy_paste_background_split: "val"
  copy_paste_edge_feather: 7

  # visualization: saves [orig | aug0 | aug1 | ...] labeled strips under
  # metric_dataset/_augmentation_preview/ so you can see what was applied
  preview_enabled: true
  preview_samples: 12
  preview_dir: "_augmentation_preview"

# --- Metric-Learning Training (DINOv3 backbone + angular-margin loss) ---
# Reads crops produced by metric_augmentation above:
#   metric_dataset/{train,val,test}/<category_name>/*.jpg
# Stage 1 = linear probe (frozen backbone), Stage 2 = partial fine-tune
# (last N transformer blocks unfrozen with a much lower LR).
metric_training:
  dataset_root: "metric_dataset"
  output_dir: "runs/metric"

  backbone: "dinov3_vits16"
  backbone_source: "torchhub"      # "torchhub" | "hf"
  hf_model_id: "facebook/dinov3-vits16-pretrain-lvd1689m"
  backbone_checkpoint: "dino_models/dinov3_vits16_pretrain_lvd1689m-08c60483.pth"
  embed_dim: 256
  hidden_dim: 512
  dropout: 0.1

  loss: "cosface"                  # cosface | arcface | subcenter_arcface | circle
  margin: 0.35
  scale: 64.0
  subcenters: 3

  img_size: 224
  batch_size: 128
  num_workers: 8
  weight_decay: 0.0005

  stage1_epochs: 5
  stage1_lr_head: 0.001

  stage2_epochs: 15
  stage2_lr_head: 0.001
  stage2_lr_backbone: 0.00001
  unfreeze_last_n_blocks: 4

  device: "0"

