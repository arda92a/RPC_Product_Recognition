# =============================================================================
# RPC Dataset - YOLO Product Detection Configuration
# =============================================================================

# --- Dataset Paths (absolute or relative to project root) ---
dataset:
  root: "/home/aoztuner/02-source/retail"
  annotations:
    train: "instances_train2019.json"
    val: "instances_val2019.json"
    test: "instances_test2019.json"
  images:
    train: "train2019"
    val: "val2019"
    test: "test2019"

# --- YOLO Conversion Output (absolute or relative to project root) ---
output:
  root: "yolo_dataset"

# --- Detection Mode ---
# "single_class" : all 200 RPC categories → one "product" class
# "multi_class"  : each of the 200 RPC categories is its own class
mode: "single_class"

# --- Class Definition (used only in single_class mode) ---
classes:
  - "product"

# --- Training Parameters ---
training:
  model: "yolo11l.pt"            # Model: yolov8n/s/m/l/x.pt, yolo11n/s/m/l/x.pt
  epochs: 100
  imgsz: 640
  batch: 16
  device: "0"                     # "0" for GPU, "cpu", "mps" for Apple Silicon
  workers: 8
  optimizer: "auto"               # SGD, Adam, AdamW, auto
  lr0: 0.01
  lrf: 0.01                       # Final learning rate factor
  patience: 50                    # Early stopping patience
  project: "runs"
  name: "rpc_singleclass_yolo11l"
  pretrained: true
  resume: false                   # Resume from last checkpoint
  exist_ok: false                 # Overwrite existing run

# --- Evaluation Parameters ---
evaluation:
  model: "runs/rpc_singleclass_yolo11l/weights/best.pt"
  conf: 0.25
  iou: 0.5
  imgsz: 640
  device: "0"
  split: "test"                   # Which split to evaluate on

# --- Weights & Biases Logging ---
wandb:
  enabled: true                  # Set to true to enable W&B logging
  project: "rpc-product-detection"
  run_name: "rpc_multiclass_yolo"
